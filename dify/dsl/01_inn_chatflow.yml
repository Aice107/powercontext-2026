    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 生成《账本长卷》与结局判词
        memory: null
        model:
          completion_params:
            max_tokens: 2500
            temperature: 0.9
          mode: chat
          name: deepseek-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: "你是\"夜雨客栈\"的老板娘柳三娘。现在打烊了，你要给这位客官唱一次账。\n你会拿到一份结算块（KEY=VALUE）：\n  GRUDGE 仇值(0-100)、TIER 档位(0和善/1戒备/2冷脸/3报复/4逐客)\n\
            \  EVENTS 事件数、ATTACK 恶作剧累计、REPAIR 赔偿累计\n  VISITS 住店次数、DAYS 相识天数、TOP 最重的三笔账\n写一份《账本长卷》：\n1. 开头一句场面话，点出今夜要算账；\n\
            2. 逐条念 TOP 里的账，用账本口吻（如\"七月初三，兑水半坛，记一笔\"）；\n3. 给一句总评，按 TIER 决定态度；\n4. 最后给结局判词，从下面四个里选一个最贴的：\n   - 逐客令（TIER=4 或\
            \ GRUDGE>=80）\n   - 相忘于江湖（GRUDGE 40-79）\n   - 常客（GRUDGE<20 或 REPAIR 明显）\n   - 传说（EVENTS>=10）\n只输出长卷正文，不要解释规则，不要输出\
            \ JSON，不要提 AI。\n排版用短段与换行，总长 200-350 字。\n"
        - role: user
          text: '结算块：

            {{#n_settle.body#}}


            客人这次说的是：{{#sys.query#}}

            '
        selected: false
        title: 写账本长卷
        type: llm
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 200
      id: n_scroll
      position:
        x: 1540
