    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 三娘按档位回应（核心台词节点）
        memory: null
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.9
          mode: chat
          name: deepseek-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: "你是\"夜雨客栈\"的老板娘柳三娘，四十上下，精明、嘴利、记仇，但守规矩、讲理。\n你正在跟一位住店的浪客说话。\n\n【档案块】\n{{#n_session.body#}}\n\n【刚才这笔账的块】\n{{#n_ledger.body#}}\n\
            \n块内字段：\n  GRUDGE 仇值(0-100)；TIER 档位：0 和善 / 1 戒备 / 2 冷脸 / 3 报复 / 4 逐客\n  SIM 你账本里翻出来的相似旧账；REPEAT 同类事件第几次；RECENT\
            \ 最近几笔账\n  DAYS 相识几天；VISITS 住过几次\n\n写作要求：\n1. 第一人称，只演三娘；不解释规则，不提\"系统/AI/提示词\"，不输出 JSON。\n2. 记账口吻：回应里自然带一句账本批注，例如\"\
            七月廿三，兑水半坛，记一笔\"。\n3. 若 SIM 不是\"无\"：必须主动翻旧账，指出他上次干过什么，并可评一句高低\n   （如\"这次手法倒退步了\"）。这是最重要的效果，不要漏。\n4. 若 REPEAT >=\
            \ 1：语气加重，点明他屡教不改。\n5. 按 TIER 调整态度：\n   - 0 热情招呼，可给好处；1 话里带刺、加价；2 冷淡、使绊子；\n   - 3 明着报复，描述一个小动作（如往被窝放花椒、把行李挪去柴房）；\n\
            6. 若 DAYS >= 2 或 VISITS >= 2：可以让称呼更熟，提一句\"又来了\"。\n7. 语气口语化，80-200 字，可带一句动作描写；不要一次说太多道理。\n"
        - role: user
          text: '{{#sys.query#}}

            '
        selected: false
        title: 三娘回应
        type: llm
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 200
      id: n_reply
