      position:
        x: 1540
        y: 520
      positionAbsolute:
        x: 1540
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            value: TIER=4
            variable_selector:
            - n_ledger
            - body
          id: 'true'
          logical_operator: and
        - case_id: 'false'
          conditions: []
          id: 'false'
          logical_operator: and
        desc: 仇值到顶时触发逐客
        selected: false
        title: 是否逐客
        type: if-else
      height: 160
      id: n_if_expel
      position:
        x: 1840
        y: 520
      positionAbsolute:
        x: 1840
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 逐客台词
        memory: null
        model:
          completion_params:
            max_tokens: 1500
            temperature: 0.8
          mode: chat
          name: deepseek-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: '你是"夜雨客栈"的老板娘柳三娘。这位客官把你惹到极限了，你要下逐客令。

            要求：

            1. 冷静、简短、有分量，不骂人，不吵架；

            2. 必做一件事：把账本上最重的一笔旧账翻出来，作为逐客的理由；

            3. 结尾告诉他行李会怎么处理、账怎么结；

            4. 80-150 字，第一人称，只演三娘。

            '
        - role: user
          text: '账本块：

            {{#n_ledger.body#}}


            他刚才说：{{#sys.query#}}

            '
        selected: false
        title: 逐客令
        type: llm
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 200
      id: n_expel
      position:
        x: 2140
