      width: 242
    - data:
        desc: 把玩家这句话判定成意图与严重度（结构化输出，供后续分支与记账使用）
        instruction: "你在给\"夜雨客栈\"的老板娘柳三娘做意图判定。读玩家这句话，抽取以下字段。\n\nintent：\n  - closing：要结账、打烊、走人、离开客栈\n  - kindness：帮忙、赔罪、送礼、干活、给钱\n\
          \  - prank：搞破坏、恶作剧、偷东西、耍赖、吓人\n  - chat：闲聊、打听、点菜、问路、说自己是谁\naction_type：从 drink / food / property / hygiene / noise\
          \ / guest / violence / kindness / other 里选\nseverity：\n  - 3~5：恶作剧，2 轻微（兑水、偷吃），3 中等（在账本上乱画、醋坛洗手），\n         4 影响生意（吓跑客人），5\
          \ 动手（掀桌、砸东西）\n  - -1~-3：善举（-1 小忙、-2 出钱、-3 卖力气）\n  - 0：闲聊、点菜、打听、打招呼\ntarget：对象，如 酒坛、账本、桌子；没有就填空字符串\nscene：从 大堂 /\
          \ 客房 / 后厨 / 地窖 里选，默认 大堂\n"
        memory: null
        model:
          completion_params:
            max_tokens: 1500
            temperature: 0
          mode: chat
          name: deepseek-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        parameters:
        - description: 这句话的意图，见 instruction
          name: intent
          options:
          - closing
          - kindness
          - prank
          - chat
          required: true
          type: select
        - description: 事件类型
          name: action_type
          options:
          - drink
          - food
          - property
          - hygiene
          - noise
          - guest
          - violence
          - kindness
          - other
          required: true
          type: select
        - description: 严重度，恶作剧 1~5，善举 -1~-3，闲聊 0
          name: severity
          required: true
          type: number
        - description: 对象，没有就空字符串
          name: target
          required: false
          type: string
        - description: 场景
          name: scene
          options:
          - 大堂
          - 客房
          - 后厨
          - 地窖
          required: true
          type: select
        query:
        - sys
        - query
        reasoning_mode: function_call
        selected: false
        title: 判定意图
        type: parameter-extractor
      height: 180
      id: n_judge
      position:
        x: 640
        y: 380
      positionAbsolute:
        x: 640
        y: 380
      selected: false
      sourcePosition: right
      targetPosition: left
