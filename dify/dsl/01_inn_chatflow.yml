      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 往酒坛里兑半坛水
    - 偷吃灶上的酱牛肉
    - 三娘，我回来了
    - 打烊，结账
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
