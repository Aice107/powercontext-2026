          - key: ''
            type: text
            value: "{\n  \"player_id\": \"{{#start.player_id#}}\",\n  \"conversation_id\": \"{{#sys.conversation_id#}}\",\n\
              \  \"session_id\": \"{{#sys.conversation_id#}}\",\n  \"turn\": 0,\n  \"action_text\": \"{{#sys.query#}}\",\n\
              \  \"action_type\": \"{{#n_judge.action_type#}}\",\n  \"severity\": {{#n_judge.severity#}},\n  \"target\": \"\
              {{#n_judge.target#}}\",\n  \"scene\": \"{{#n_judge.scene#}}\"\n}\n"
          type: json
        desc: 记一笔账，并取回相似旧账（seekdb 混合检索）
        headers: 'Content-Type: application/json'
        method: post
        params: 'format: block

          '
        selected: false
        ssl_verify: false
        timeout:
          connect: 5
          read: 15
          write: 5
        title: 记账
        type: http-request
        url: http://127.0.0.1:8010/inn/ledger
        error_strategy: default-value
