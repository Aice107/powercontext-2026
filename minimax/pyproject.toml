[project]
name = "minimax-sdd-context"
version = "0.1.0"
description = "Spec-driven development context module for the MiniMax x OceanBase competition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask>=3.0,<4",
  "pylibseekdb==1.4.0.post2",
  "PyMySQL>=1.1,<2",
  "pytest>=8,<9",
]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
